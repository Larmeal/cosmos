site_name: Pylos
site_description: A framework for encapsulating Great Expectations within data pipelines.
site_url: https://larmeal.github.io/pylos/
repo_url: https://github.com/Larmeal/pylos
repo_name: Larmeal/pylos
edit_uri: edit/main/docs/

# Every warning fails the build, so a broken link or an unparsable docstring
# is caught on the pull request instead of on the published site.
strict: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Pipeline: concepts/pipeline.md
      - Failure policy: concepts/failure-policy.md
      - Reporting: concepts/reporting.md
  - Configuration: configuration.md
  - API Reference:
      - reference/index.md
      - Modules: reference/*

theme:
  name: material
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.tabs
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  # Builds reference/ from the source tree, so a new module needs no docs change.
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  # Reads the nav that gen_ref_pages.py writes to reference/SUMMARY.md.
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mike:
      version_selector: true
      canonical_version: latest
      # A redirect page instead of a symlink, which GitHub Pages does not always follow.
      alias_type: redirect
  - mkdocstrings:
      handlers:
        python:
          # Read the source statically. No import happens, so the docs build needs
          # neither Great Expectations nor any optional dependency installed.
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: google
            docstring_section_style: spacy
            filters: ["!^_"]
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
          extensions:
            - griffe_pydantic:
                schema: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
    default: latest
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Larmeal/pylos
      name: GitHub repository
