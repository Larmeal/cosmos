name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy the dev docs
        if: github.ref_type == 'branch'
        run: uv run --locked --only-group docs mike deploy --push dev
      - name: Deploy a release
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          uv run --locked --only-group docs mike deploy --push --update-aliases "$minor" latest
          uv run --locked --only-group docs mike set-default --push latest
