name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Check the PR title against the commit schema
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --only-group dev cz check --message "$PR_TITLE"
