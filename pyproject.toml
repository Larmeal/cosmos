[project]
name = "cosmos"
version = "0.1.0"
description = "A framework for encapsulating Great Expectations within data pipelines, providing reusable validation layers, expectation suite management, and seamless pipeline integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "great-expectations>=1.17,<2",
    "pandas>=2.1,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
gcp = [
    "fsspec>=2026.7.0",
    "gcsfs>=2026.8.0",
    "google-cloud-bigquery>=3.4,<4",
    "google-cloud-storage>=3.10,<4",
]
spark = [
    "great-expectations[spark]>=1.17,<2",
]

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "faker>=40.11.1",
    "ipykernel>=7.2.0",
    "pendulum>=3.2.0",
    "prek>=0.3.8",
    "pytest>=8",
    "ruff>=0.15.7",
]
docs = [
    "mkdocs>=1.6.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors – PEP 8 style errors
    "F",   # pyflakes – unused imports, undefined names
    "W",   # pycodestyle warnings – trailing whitespace, blank lines
    "I",   # isort – import ordering
    "N",   # pep8-naming – naming conventions (snake_case, PascalCase)
    "UP",  # pyupgrade – modernize Python syntax
    "B",   # flake8-bugbear – likely bugs and design issues
    "ANN", # flake8-annotations – missing type hints
]
ignore = ["UP015", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "0.1.0"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
